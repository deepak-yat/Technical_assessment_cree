services:
  mongodb:
    image: mongo:7.0
    container_name: hotel_reservation_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_REPLICA_SET_NAME: rs0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            var status = rs.status();
            if (status.ok === 1) { quit(0); }
          } catch(e) {
            var init = rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
            if (init.ok === 1) { quit(0); }
            quit(1);
          }
        "
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 3s
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
